    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
    <div class="container">
        <div class="logo">DC梦想家创意</div>
        <nav class="nav-menu">
            <a href="home.html">首页</a>
            <a href="index.html">艺术分类</a>
            <a href="design.html">设计分类</a>
            <a href="#">发起项目</a>
        </nav>
        <div class="user-actions">
            <a href="#">登录 / 注册</a>
        </div>
    </div>
</header>

    <section class="hero-banner">
        <div class="container">
            <h1>发现全球原创创意项目</h1>

            <button class="hero-btn">立即探索</button>
        </div>
    </section>

    <section class="category-header">

            <h2>热门分类</h2>
            <div class="filter-bar">
                <button class="filter-btn active">全部</button>

                <button class="filter-btn">书籍画册</button>

        </div>

    <main class="projects-grid container">
        <div class="project-card">
            <div class="card-img"></div>
            <div class="card-content">
                <span class="label">热门推荐</span>
                <h3>国风原创插画系列</h3>

                <div class="fund-info">
                    <div class="funded">超高人气</div>
                    <div class="days-left">进行中</div>
                </div>
            </div>
        </div>
        <div class="project-card">
            <div class="card-img"></div>
            <div class="card-content">
                <span class="label">热门推荐</span>
                <h3>创意文创周边设计</h3>
                <p>创意工作室</p>
                <div class="fund-info">
                    <div class="funded">超高人气</div>
                    <div class="days-left">进行中</div>
                </div>
            </div>
        </div>
    </main>

<div class="footer">
